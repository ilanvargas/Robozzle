<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Robot Visualizer</title>
  <style>
    @font-face {
      font-family: 'robots';
      src: url('./projRobotFont.ttf') format('truetype');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a24;
      --surface:   #22222f;
      --surface2:  #2a2a3a;
      --border:    #3a3a50;
      --text:      #e8e8f0;
      --muted:     #7a7a95;
      --red:       #992222;
      --red-light: #cc3333;
      --green:     #1e7a1e;
      --green-light:#28a428;
      --blue:      #1545a8;
      --blue-light:#2060d0;
      --accent:    #7060e0;
      --accent2:   #a090ff;
      --ok:        #2e7d32;
      --err:       #8b1a1a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 20px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent2);
    }

    #puzzle-select {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      min-width: 220px;
    }
    #puzzle-select:focus { outline: 2px solid var(--accent); }

    /* ── Puzzle info ── */
    #puzzle-info {
      width: 100%;
      max-width: 960px;
      border-left: 3px solid var(--accent);
      padding-left: 12px;
    }
    #puzzle-title { font-size: 16px; font-weight: 700; color: var(--accent2); }
    #puzzle-about { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* ── Main layout ── */
    #main {
      width: 100%;
      max-width: 960px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* ── Board ── */
    #board-wrap {
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    #board-wrap table {
      border-collapse: collapse;
    }

    #board-wrap td {
      width: 28px;
      height: 28px;
      text-align: center;
      vertical-align: middle;
      font-size: 13px;
      border: 1px solid #12121a;
    }

    td.empty-cell  { background: #111118; }
    td.red         { background: var(--red); }
    td.green       { background: var(--green); }
    td.blue        { background: var(--blue); }
    td.star-cell   { color: #ffe066; font-size: 11px; }
    td.robot-cell  {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      outline: 2px solid #fff;
      outline-offset: -2px;
      z-index: 1;
      position: relative;
    }
    td.red.robot-cell    { background: var(--red-light); }
    td.green.robot-cell  { background: var(--green-light); }
    td.blue.robot-cell   { background: var(--blue-light); }

    /* ── Right panel ── */
    #right-panel {
      flex: 1 1 260px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Controls ── */
    #controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #controls button {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface2);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    #controls button:hover  { background: var(--border); }
    #controls button:active { transform: scale(0.93); }

    #btn-run   { color: #7aff7a; }
    #btn-step-fwd { color: #a090ff; }
    #btn-step-bwd { color: #f0a060; }
    #btn-reset { color: #ff6b6b; }

    /* ── Status ── */
    #status-msg {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      min-height: 36px;
    }
    #status-msg.status-ok  { background: #1a3a1a; border-color: #2e6b2e; color: #7aff7a; }
    #status-msg.status-err { background: #3a1a1a; border-color: #8b2e2e; color: #ff7a7a; }
    #status-msg.status-info{ color: var(--text); }

    /* ── Functions ── */
    #functions-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    #functions-panel h2 {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    #functions-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .func-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .func-label {
      width: 28px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent2);
      flex-shrink: 0;
    }

    .slot-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #252530;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: filter 0.1s, transform 0.1s, border-color 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .slot-btn:hover       { filter: brightness(1.3); border-color: var(--accent); }
    .slot-btn:active      { transform: scale(0.92); }
    .slot-btn.selected    { border: 2px solid var(--accent2); }

    /* ── Legend ── */
    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── Palette popup ── */
    #palette-popup {
      background: #1e1e2e;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 8px;
      gap: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }

    .palette-row {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .palette-btn {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: filter 0.1s, transform 0.1s;
      padding: 0;
    }
    .palette-btn:hover  { filter: brightness(1.4); }
    .palette-btn:active { transform: scale(0.9); }
    .clear-btn {
      background: #2a2a3a !important;
      border-color: #555 !important;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <h1>🤖 Robot</h1>
    <select id="puzzle-select">
      <option value="">— Choisir un puzzle —</option>
    </select>
  </header>

  <div id="puzzle-info">
    <div id="puzzle-title">—</div>
    <div id="puzzle-about"></div>
  </div>

  <div id="main">

    <div id="board-wrap">
      <table><tbody id="game-board"></tbody></table>
    </div>

    <div id="right-panel">

      <div id="controls">
        <button id="btn-run"      title="Lancer / Pause">▶</button>
        <button id="btn-step-fwd" title="Avancer d'une étape">➔</button>
        <button id="btn-step-bwd" title="Reculer d'une étape">←</button>
        <button id="btn-reset"    title="Réinitialiser">↺</button>
      </div>

      <div id="status-msg">Choisis un puzzle pour commencer.</div>

      <div id="functions-panel">
        <h2>Fonctions</h2>
        <div id="functions-container"></div>
      </div>

      <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Rouge</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Vert</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div> Bleu</div>
        <div class="legend-item">★ étoile à ramasser</div>
        <div class="legend-item">↑↓←→ robot</div>
      </div>

    </div>
  </div>

  <script type="module" src="./funcs.ts"></script>
</body>
</html>
